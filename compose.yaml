services:
  serverest:
    image: paulogoncalvesbh/serverest:3.2.0
    container_name: outsera-serverest
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  testes-api:
    profiles: ["api"]
    build:
      context: ./testes-api
    environment:
      BASE_URL: http://serverest:3000
      GERAR_RELATORIO: "false"
    depends_on:
      serverest:
        condition: service_healthy
    volumes:
      - ./relatorios/api:/workspace/relatorios
    command:
      - sh
      - -c
      - >-
        ./mvnw -B test $${MAVEN_ARGS:-};
        codigo=$$?;
        if [ "$${GERAR_RELATORIO}" = "true" ]; then
          ./mvnw -B allure:report;
          codigo_relatorio=$$?;
          if [ $$codigo -eq 0 ]; then codigo=$$codigo_relatorio; fi;
        fi;
        mkdir -p /workspace/relatorios/allure-results;
        if [ -d target/allure-results ]; then cp -R target/allure-results/. /workspace/relatorios/allure-results/; fi;
        if [ -d target/site/allure-maven-plugin ]; then
          mkdir -p /workspace/relatorios/allure-report;
          cp -R target/site/allure-maven-plugin/. /workspace/relatorios/allure-report/;
        fi;
        exit $$codigo

  testes-web:
    profiles: ["web"]
    build:
      context: ./testes-web-e2e
    environment:
      CYPRESS_baseUrl: https://automationexercise.com
    volumes:
      - ./relatorios/web:/e2e/relatorios
    entrypoint:
      - sh
      - -c
      - >-
        npm run $${MODO_WEB:-regressao};
        codigo=$$?;
        mkdir -p /e2e/relatorios/allure-results /e2e/relatorios/allure-report /e2e/relatorios/videos /e2e/relatorios/screenshots;
        if [ -d allure-results ]; then cp -R allure-results/. /e2e/relatorios/allure-results/; fi;
        if [ -d allure-report ]; then cp -R allure-report/. /e2e/relatorios/allure-report/; fi;
        if [ -d cypress/videos ]; then cp -R cypress/videos/. /e2e/relatorios/videos/; fi;
        if [ -d cypress/screenshots ]; then cp -R cypress/screenshots/. /e2e/relatorios/screenshots/; fi;
        exit $$codigo

  k6-fumaca:
    profiles: ["k6-fumaca"]
    image: grafana/k6:0.56.0
    working_dir: /scripts
    user: "0:0"
    environment:
      BASE_URL: http://serverest:3000
      DIRETORIO_RELATORIOS: relatorios/fumaca
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_OPEN: "false"
      K6_WEB_DASHBOARD_PORT: "-1"
      K6_WEB_DASHBOARD_PERIOD: 1s
      K6_WEB_DASHBOARD_EXPORT: /scripts/relatorios/fumaca/dashboard.html
    depends_on:
      serverest:
        condition: service_healthy
    volumes:
      - ./testes-performance:/scripts
    command: run cenarios/fumaca.js

  k6-carga:
    profiles: ["k6-carga"]
    image: grafana/k6:0.56.0
    working_dir: /scripts
    user: "0:0"
    environment:
      BASE_URL: http://serverest:3000
      DIRETORIO_RELATORIOS: relatorios/carga
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /scripts/relatorios/carga/dashboard.html
      K6_WEB_DASHBOARD_OPEN: "false"
      K6_WEB_DASHBOARD_PORT: "-1"
      K6_WEB_DASHBOARD_PERIOD: 5s
    depends_on:
      serverest:
        condition: service_healthy
    volumes:
      - ./testes-performance:/scripts
    command: run cenarios/carga-500-usuarios.js
