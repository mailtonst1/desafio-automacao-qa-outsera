services:
  serverest:
    image: paulogoncalvesbh/serverest:3.2.0
    container_name: outsera-serverest
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  testes-api:
    profiles: ["api"]
    build:
      context: ./testes-api
    environment:
      BASE_URL: http://serverest:3000
      GERAR_RELATORIO: "false"
    depends_on:
      serverest:
        condition: service_healthy
    volumes:
      - ./relatorios/api:/workspace/relatorios
    command:
      - sh
      - -c
      - >-
        ./mvnw -B test $${MAVEN_ARGS:-};
        codigo=$$?;
        if [ "$${GERAR_RELATORIO}" = "true" ]; then
          ./mvnw -B allure:report;
          codigo_relatorio=$$?;
          if [ $$codigo -eq 0 ]; then codigo=$$codigo_relatorio; fi;
        fi;
        mkdir -p /workspace/relatorios/allure-results;
        if [ -d target/allure-results ]; then cp -R target/allure-results/. /workspace/relatorios/allure-results/; fi;
        if [ -d target/site/allure-maven-plugin ]; then
          mkdir -p /workspace/relatorios/allure-report;
          cp -R target/site/allure-maven-plugin/. /workspace/relatorios/allure-report/;
        fi;
        exit $$codigo
