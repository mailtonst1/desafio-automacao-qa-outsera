name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida configuracoes e arquivos sensiveis
        run: |
          docker compose config --quiet
          test ! -f .env
          test -f testes-api/mvnw
          test -f testes-web-e2e/package-lock.json
          test -f testes-mobile/mvnw
          test -f relatorio-unificado/package-lock.json
          ! git ls-files | grep -E '\.(apk|ipa)$'
          ! git ls-files | grep -E '(^|/)(allure-results|allure-report|relatorios)/(summary\.(json|txt|html))$'
          ! rg -n -i '(api[_-]?key|secret|ghp_)' --glob '!**/.env.example' .

  testes-api:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: docker compose up -d serverest --wait
      - run: bash ./mvnw -B test allure:report
        working-directory: testes-api
      - if: failure()
        run: docker compose logs serverest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: |
            testes-api/target/allure-results
            testes-api/target/surefire-reports
          if-no-files-found: warn

  testes-web:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: testes-web-e2e/package-lock.json
      - name: Instalar dependências Web
        run: npm ci
        working-directory: testes-web-e2e
      - name: Instalar Cypress
        run: npx cypress install
        working-directory: testes-web-e2e
      - name: Validar tipos do projeto Web
        run: npm run typecheck
        working-directory: testes-web-e2e
      - name: Executar análise estática com ESLint
        run: npm run lint
        working-directory: testes-web-e2e
      - name: Executar regressão Web e acessibilidade
        run: npm run regressao
        working-directory: testes-web-e2e
      - name: Publicar evidências Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-web
          path: |
            testes-web-e2e/allure-results
            testes-web-e2e/cypress/screenshots
            testes-web-e2e/cypress/videos
          if-no-files-found: warn

  testes-mobile:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - run: |
          npm install -g appium@3.1.2
          appium driver install uiautomator2@6.7.9
          bash ./testes-mobile/scripts/baixar-aplicativo.sh
      - run: sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p testes-mobile/target
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install -r testes-mobile/apps/mda-2.2.0-25.apk
            appium server --address 127.0.0.1 --port 4723 > testes-mobile/target/appium.log 2>&1 &
            cd testes-mobile && bash ./mvnw -B test allure:report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-mobile
          path: |
            testes-mobile/target/allure-results
            testes-mobile/target/surefire-reports
            testes-mobile/target/appium.log
          if-no-files-found: warn

  performance-fumaca:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash ./scripts/executar-performance.sh fumaca
          find testes-performance/relatorios -type f -print
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-performance
          path: testes-performance/relatorios
          if-no-files-found: warn

  performance-carga:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash ./scripts/executar-performance.sh carga
          find testes-performance/relatorios/carga -type f -print
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-performance-carga
          path: testes-performance/relatorios/carga
          if-no-files-found: warn

  relatorio-unificado:
    if: always()
    needs: [testes-api, testes-web, testes-mobile, performance-fumaca, performance-carga]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: relatorio-unificado/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: resultados-*
          path: artefatos
          merge-multiple: false
      - name: Gerar e validar relatório unificado
        env:
          PORTAL_PR_NUMBER: ${{ github.event.pull_request.number }}
          PORTAL_HEAD_REF: ${{ github.head_ref }}
          PORTAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci
          npm test
          mkdir -p entradas/api entradas/web entradas/mobile testes-performance/relatorios/fumaca testes-performance/relatorios/carga
          find ../artefatos/resultados-api -type f -path '*/allure-results/*' -exec cp {} entradas/api/ \;
          find ../artefatos/resultados-web -type f -path '*/allure-results/*' -exec cp {} entradas/web/ \;
          find ../artefatos/resultados-mobile -type f -path '*/allure-results/*' -exec cp {} entradas/mobile/ \;
          find ../artefatos/resultados-performance -type f -name 'summary.*' -exec cp {} testes-performance/relatorios/fumaca/ \;
          find ../artefatos/resultados-performance -type f -name 'dashboard.html' -exec cp {} testes-performance/relatorios/fumaca/ \;
          find ../artefatos/resultados-performance-carga -type f -name 'summary.*' -exec cp {} testes-performance/relatorios/carga/ \;
          find ../artefatos/resultados-performance-carga -type f -name 'dashboard.html' -exec cp {} testes-performance/relatorios/carga/ \;
          test -s testes-performance/relatorios/fumaca/summary.json
          test -s testes-performance/relatorios/carga/summary.json
          test -s testes-performance/relatorios/fumaca/dashboard.html
          test -s testes-performance/relatorios/carga/dashboard.html
          npm run preparar -- --api entradas/api --web entradas/web --mobile entradas/mobile
          npm run converter-k6 -- --origem testes-performance/relatorios/fumaca --destino temporario --perfil Fumaca
          npm run converter-k6 -- --origem testes-performance/relatorios/carga --destino temporario --perfil Carga
          test -f temporario/Fumaca-result.json
          test -f temporario/Carga-result.json
          npm run gerar
          npm run preparar-publicacao -- --fumaca testes-performance/relatorios/fumaca --carga testes-performance/relatorios/carga
          npm run validar-portal
          test -f saida/index.html
          test -f saida/portal.json
          test -f saida/allure/index.html
          test -f saida/performance/fumaca/index.html
          test -f saida/performance/carga/index.html
        working-directory: relatorio-unificado
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-allure-unificado
          path: relatorio-unificado/saida
          if-no-files-found: warn

  quality-gate:
    if: always()
    needs: [testes-api, testes-web, testes-mobile, performance-fumaca, performance-carga, relatorio-unificado]
    runs-on: ubuntu-latest
    steps:
      - name: Aplica quality gate
        run: |
          test '${{ needs.testes-api.result }}' = success
          test '${{ needs.testes-web.result }}' = success
          test '${{ needs.testes-mobile.result }}' = success
          test '${{ needs.performance-fumaca.result }}' = success
          test '${{ needs.performance-carga.result }}' = success
          test '${{ needs.relatorio-unificado.result }}' = success

  pages:
    if: always() && needs.relatorio-unificado.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: relatorio-unificado
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: relatorio-allure-unificado
          path: relatorio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: relatorio
      - id: publicar
        uses: actions/deploy-pages@v4
