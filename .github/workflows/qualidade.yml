name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida configuracoes e arquivos sensiveis
        run: |
          docker compose config --quiet
          test ! -f .env
          test -f testes-api/mvnw
          test -f testes-web-e2e/package-lock.json
          test -f testes-mobile/mvnw
          test -f relatorio-unificado/package-lock.json
          ! git ls-files | grep -E '\.(apk|ipa)$'
          ! git ls-files | grep -E '(^|/)(allure-results|allure-report|relatorios)/(summary\.(json|txt|html))$'
          ! rg -n -i '(api[_-]?key|secret|ghp_)' --glob '!**/.env.example' .

  testes-api:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: docker compose up -d serverest --wait
      - run: bash ./mvnw -B test allure:report
        working-directory: testes-api
      - if: failure()
        run: docker compose logs serverest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: |
            testes-api/target/allure-results
            testes-api/target/surefire-reports
          if-no-files-found: warn

  testes-web:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: testes-web-e2e/package-lock.json
      - run: npm ci
        working-directory: testes-web-e2e
      - run: npx cypress install
        working-directory: testes-web-e2e
      - run: npm run regressao
        working-directory: testes-web-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-web
          path: |
            testes-web-e2e/allure-results
            testes-web-e2e/cypress/screenshots
            testes-web-e2e/cypress/videos
          if-no-files-found: warn

  performance-fumaca:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/executar-performance.sh fumaca
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-performance
          path: testes-performance/relatorios/fumaca
          if-no-files-found: warn

  relatorio-unificado:
    if: always()
    needs: [testes-api, testes-web, performance-fumaca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: relatorio-unificado/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: resultados-*
          path: artefatos
          merge-multiple: false
      - run: |
          npm ci
          mkdir -p entradas/api entradas/web testes-performance/relatorios/fumaca
          find artefatos/resultados-api -type f -exec cp {} entradas/api/ \; 2>/dev/null || true
          find artefatos/resultados-web -type f -exec cp {} entradas/web/ \; 2>/dev/null || true
          find artefatos/resultados-performance -type f -exec cp {} testes-performance/relatorios/fumaca/ \; 2>/dev/null || true
          npm run preparar -- --api entradas/api --web entradas/web
          if [ -f testes-performance/relatorios/fumaca/summary.json ]; then npm run converter-k6 -- --origem testes-performance/relatorios/fumaca --destino temporario --perfil Fumaca; fi
          npm run gerar
        working-directory: relatorio-unificado
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-allure-unificado
          path: relatorio-unificado/saida
          if-no-files-found: warn

  quality-gate:
    if: always()
    needs: [testes-api, testes-web, performance-fumaca, relatorio-unificado]
    runs-on: ubuntu-latest
    steps:
      - name: Aplica quality gate
        run: |
          test '${{ needs.testes-api.result }}' = success
          test '${{ needs.testes-web.result }}' = success
          test '${{ needs.performance-fumaca.result }}' = success
